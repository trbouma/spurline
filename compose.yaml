name: spurline

services:
  spurline:
    build:
      context: .
    image: spurline:local
    container_name: spurline
    restart: unless-stopped
    init: true
    ports:
      - "${SPURLINE_BIND_ADDRESS:-127.0.0.1}:${SPURLINE_PORT:-8780}:8080"
    environment:
      SPURLINE_HOST: 0.0.0.0
      SPURLINE_PORT: 8080
      SPURLINE_DATABASE: /data/spurline.sqlite3
      SPURLINE_VERIFY_SIGNATURES: "${SPURLINE_VERIFY_SIGNATURES:-true}"
      SPURLINE_PUBLIC_URL: "${SPURLINE_PUBLIC_URL:-}"
      SPURLINE_SERVICE_NSEC: "${SPURLINE_SERVICE_NSEC:-}"
      SPURLINE_SERVICE_MANAGEMENT: "${SPURLINE_SERVICE_MANAGEMENT:-independent}"
      SPURLINE_WITNESS_ENABLED: "${SPURLINE_WITNESS_ENABLED:-false}"
      SPURLINE_WITNESS_CLOCK_FILE: "${SPURLINE_WITNESS_CLOCK_FILE:-}"
      SPURLINE_WITNESS_CLOCK_MODE: "${SPURLINE_WITNESS_CLOCK_MODE:-bounded}"
      SPURLINE_WITNESS_QUEUE_LIMIT: "${SPURLINE_WITNESS_QUEUE_LIMIT:-1000}"
      SPURLINE_WITNESS_MAX_DELAY_SECONDS: "${SPURLINE_WITNESS_MAX_DELAY_SECONDS:-60}"
    volumes:
      - spurline-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spurline-data:
    name: spurline-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${SPURLINE_DATA_DIR:?Set SPURLINE_DATA_DIR in .env}"
