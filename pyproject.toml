[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spurline"
version = "0.1.0"
description = "A local Nostr relay written in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Tim Bouma" }
]
dependencies = [
  "coincurve>=20.0.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
docs = [
  "mkdocs>=1.6.0",
]

[project.scripts]
spurline = "spurline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/spurline"]

[tool.ruff]
line-length = 100
target-version = "py311"
