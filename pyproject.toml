[tool.poetry]
name = "spurline"
version = "0.1.0"
description = "A local Nostr relay written in Python."
authors = ["Tim Bouma"]
license = "MIT"
readme = "README.md"
packages = [{ include = "spurline", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
coincurve = ">=20.0.0"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.28.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"

[tool.poetry.scripts]
spurline = "spurline.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
