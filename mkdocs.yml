site_name: Spurline
site_description: A local relay for the global Nostr network.
site_url: https://trbouma.github.io/spurline/
repo_url: https://github.com/trbouma/spurline
repo_name: trbouma/spurline
theme:
  name: material
  language: en
  logo: assets/spurline-logo.svg
  favicon: assets/spurline-logo.svg
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode
nav:
  - Home: index.md
  - Understand Spurline:
      - Why Spurline?: why-spurline.md
      - Runtime Model: runtime-model.md
      - Storage Backends: storage-backends.md
      - Selective Relay Synchronization: selective-relay-synchronization.md
      - Optional Post Quantum Anchors: post-quantum-anchor-events.md
      - Append Only Evidence Policy: append-only-evidence-policy.md
      - Automatic Observation Receipts: automatic-observation-receipts.md
      - Observation Receipt Profile v1: observation-receipt-v1.md
      - Operational Receipt Profile v2: observation-receipt-v2.md
      - Finding OpenETR Witness Records: openetr-witness-records.md
  - Operate Spurline:
      - Service Commissioning: service-commissioning.md
      - Witness Operator Runbook: witness-operator-runbook.md
      - Operator Signing CLI: operator-signing.md
      - Automatic Witness Operation: automatic-witness-operation.md
      - Operational Witness Setup: operational-witness-setup.md
      - Operational Witness Policy: policies/operational-witness-v1.md
      - Witness Authorization Lifecycle: witness-lifecycle.md
      - Getting Started: getting-started.md
      - Container Deployment: container-deployment.md
      - Relay API: relay-api.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Spurline is open-source software released under the MIT License.
